[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garmingo"
version = "0.1.0"
description = "End-to-end health and workout data analysis system"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "click",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
garmingo = "garmingo.cli.etl_commands:main"
